plugins {
    id 'com.android.application'
}

android {
    namespace 'o.my.wiening'
    compileSdk 34 // 确保大于等于 30

    defaultConfig {
        applicationId "o.my.wiening"
        // 虽然您的手机是 35，但为了兼容性，我们通常设置一个 SAF 的最低版本
        minSdkVersion 26
        targetSdk 34
        versionCode 15
        versionName "Beta 2.2.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false // Temporarily disable
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        // 确保这一行是 true
        buildConfig true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17 // 使用您的 JDK 版本
        targetCompatibility JavaVersion.VERSION_17 // 使用您的 JDK 版本
    }
}

dependencies {
    // UI 和兼容性依赖
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.8.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.cardview:cardview:1.0.0'

    // SAF 文件操作依赖
    implementation 'androidx.documentfile:documentfile:1.0.1'

    // Service 和 Activity 通信依赖 (LocalBroadcastManager)
    implementation 'androidx.localbroadcastmanager:localbroadcastmanager:1.1.0'

    // 测试依赖
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
